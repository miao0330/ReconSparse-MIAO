train:
  wandb:
    enabled: false
    group: FullNuScenes88_policy_loop_GRPO
  actor_learner:
    buffer_dir: /htfs/filesystem_pfs/waytous/lixm/ReconSparse/outputs/experiments/ull_nuscenes_88_baseline_collision500/train/policy_loop_grpo/actor_learner
    timestamp_buffer_dir: false
    learner_gpu_id: 0
    learner_gpu_ids:
    - 0
    actor_gpu_pool:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    actors_per_gpu: 1
    auto_max_inflight_per_actor: false
    max_inflight_per_actor: 64
    actor_horizon: 32
    num_envs_per_actor: 1
    vec_env_mode: serial
    samples_per_update: 786
    shards_per_update: 48
    shard_collect_timeout_s: 1800
    actor_shard_stall_timeout_s: 3600
    allow_partial_updates_after_timeout: true
    restart_failed_actors: false
    max_actor_restarts: 0
    max_updates: 32
  policy_loop_grpo:
    enable: true
    coef: 0.1
    num_candidates: 4
    branch_horizon_steps: 16
    branch_parallelism: 4
    branch_bootstrap: auto
    keyframe_times_s:
    - 4.0
    - 8.0
    rl_step_s: 0.5
    intervention_steps: 2
    severe_offroad_lateral_m: 3.5
    continuation_mode: argmax
    deterministic_seed: true
    norm_eps: 1.0e-06
    train_metric_heads_only: true
    metric_heads_prefix: _trajectory_head.decoder.layers.1.metric_heads
agent:
  ckpt: /htfs/filesystem_pfs/waytous/lixm/ReconSparse/egoADs/SparseDriveV2/ckpt/sparsedrive_navsimv2.ckpt
