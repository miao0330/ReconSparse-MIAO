train:
  policy_loop_grpo:
    reward:
      mode: step_path
      common:
        dt: 0.5
        logging:
          wandb:
            enable: true
            prefix: rl
        ea:
          enable: false
          weight: 0.0
        terminal:
          enable: true
          xz_err_m_max: 25.0
          yaw_err_deg_max: 45.0
          terminate_on_xz_err: true
          terminate_on_yaw_err: true
          terminate_on_static_collision: true
          terminate_on_dynamic_collision: true
          yaw_err_patience_steps: 5
          xy_err_patience_steps: 4
          penalty: 0.0
          success_bonus: 0.0
          apply_on_failure: true
          apply_on_timeout: false
          apply_on_env_done: false
      step_path:
        CRAFT:
          enable: false
        path:
          interp_ds_m: 0.25
          w_progress: 20.0
          progress_forward_cap_m: 2.0
          progress_backward_cap_m: 0.5
          w_lateral: 2.0
          lateral_free_m: 0.3
          lateral_huber_delta_m: 0.5
          w_yaw: 1.0
          yaw_free_deg: 5.0
          yaw_huber_delta_deg: 10.0
        comfort:
          w_longitudinal_jerk: 0.2
          longitudinal_jerk_free: 1.5
          longitudinal_jerk_delta: 2.0
          w_yaw_jerk: 0.2
          yaw_jerk_free: 0.2
          yaw_jerk_delta: 0.3
          jerk_clip: 50.0
        collision:
          mode: dense_penalty
          w_static: 50.0
          w_dynamic: 50.0
          gate_scale: 0.0
        safety:
          enable: true
          lookahead_m: 15.0
          corridor_half_width_m: 2.5
          safe_gap_m: 8.0
          safe_ttc_s: 3.0
          w_clearance: 1.0
          w_ttc: 1.0
          progress_gate_strength: 1.0
          min_progress_gate: 0.3
