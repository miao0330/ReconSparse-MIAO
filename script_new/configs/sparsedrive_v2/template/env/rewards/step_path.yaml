        severe_gate_scale: 0.0
      comfort:
        w_longitudinal_jerk: 0.0
        longitudinal_jerk_free: 1.5
        longitudinal_jerk_delta: 2.0
        w_yaw_jerk: 0.0
        yaw_jerk_free: 0.2
        yaw_jerk_delta: 0.3
        jerk_clip: 50.0
      collision:
        mode: dense_penalty
        w_static: 50.0
        w_dynamic: 50.0
        gate_scale: 0.0
      safety:
        enable: false
        lookahead_m: 15.0
        corridor_half_width_m: 2.5
