env:
  backend: hugsim_ori
  max_steps: 36
  step_frames: 5
  use_all_scenes: true
  scene_sampling: random
  start_frame:
    mode: zero
    allow_short_tail: false
    min: 0
  hugsim:
    repo: /htfs/filesystem_pfs/waytous/lixm/HUGSIM-ORI
    scenario_dir: /htfs/filesystem_pfs/waytous/lixm/HUGSIM-ORI/configs/scenarios/nuscenes
    base_path: /htfs/filesystem_pfs/waytous/lixm/HUGSIM-ORI/configs/sim/nuscenes_eval_sparsedrive_v2_ppo_grpo_ver14.yaml
    camera_path: /htfs/filesystem_pfs/waytous/lixm/HUGSIM-ORI/configs/sim/nuscenes_camera.yaml
    kinematic_path: /htfs/filesystem_pfs/waytous/lixm/HUGSIM-ORI/configs/sim/kinematic.yaml
    model_base: /htfs/filesystem_pfs/waytous/datasets/miao/HUGSIM-ORI/HUGSIM/scenes/nuscenes
    launch_mode: fifo
    pixi_cmd: pixi
    fifo_timeout_s: 300
    fifo_poll_interval_s: 0.2
    recon_data_root: /htfs/filesystem_pfs/waytous/lixm/ReconSparse/assets/nus/data
    nuscenes_root: /htfs/filesystem_pfs/waytous/lixm/ReconSparse/assets/nuscenes/v1.0-trainval
    frame2token_dir: /htfs/filesystem_pfs/waytous/lixm/ReconSparse/assets/nus/information/frame2token
    alignment:
      enabled: true
      max_rmse_m: 2.0
      use_recon_cache_objects: true
      use_hugsim_inserted_objects: true
    substeps_per_rl_step: 1
  reward:
    common:
      dt: 0.5
      ea:
        enable: false
        weight: 0.0
      terminal:
        enable: true
        xz_err_m_max: 25.0
        yaw_err_deg_max: 45.0
        terminate_on_xz_err: true
        terminate_on_yaw_err: true
        terminate_on_static_collision: true
        terminate_on_dynamic_collision: true
        yaw_err_patience_steps: 5
        xy_err_patience_steps: 4
        penalty: 0.0
        success_bonus: 0.0
        apply_on_failure: true
        apply_on_timeout: false
        apply_on_env_done: false
      logging:
        wandb:
          enable: true
          prefix: rl
